<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Tasks - SocialWorkBD</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

  <style>

    .tasks-page {
      max-width: 700px;
      margin: 20px auto;
      padding: 15px;
    }

    .task-create-box {
      background: #fff;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }

    .task-create-box h2 {
      margin-top: 0;
    }

    .task-create-box label {
      display: block;
      margin-top: 14px;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .task-create-box input,
    .task-create-box textarea,
    .task-create-box select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      border: 1px solid #ddd;
      border-radius: 9px;
      font-size: 15px;
    }

    .task-create-box textarea {
      resize: vertical;
      min-height: 90px;
    }

    .task-link-row {
      display: flex;
      gap: 7px;
      margin-bottom: 9px;
    }

    .task-link-row input {
      flex: 1;
    }

    .remove-link-btn {
      width: 40px !important;
      padding: 8px !important;
      background: #f1f1f1;
      color: #555;
      border: 0;
      border-radius: 8px;
      font-size: 20px;
    }

    #add-link-btn {
      width: auto;
      padding: 7px 12px;
      margin-top: 3px;
      background: #f3f4f6;
      color: #333;
      border: 0;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
    }

    #create-task-btn {
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
    }

    .task-list-title {
      margin-top: 25px;
    }

  </style>

</head>

<body>

  <!-- ======================================
       HEADER
  ======================================= -->

  <header class="site-header">

    <div class="container">

      <h1>SocialWorkBD</h1>

      <p>
        ছোট ছোট Task করুন, MHR GOLD আয় করুন
      </p>

      <nav>

        <a href="index.html">
          হোম
        </a>

        <a href="tasks.html">
          Tasks
        </a>

        <a href="profile.html">
          প্রোফাইল
        </a>

        <a href="dashboard.html">
          ড্যাশবোর্ড
        </a>

      </nav>

    </div>

  </header>


  <!-- ======================================
       MAIN
  ======================================= -->

  <main class="tasks-page">


    <!-- ====================================
         CREATE TASK
    ===================================== -->

    <section class="task-create-box">

      <h2>
        ➕ নতুন Task তৈরি করুন
      </h2>

      <p>
        Client এখানে ছোট কাজ তৈরি করতে পারবেন।
      </p>


      <form id="task-form">


        <!-- Task Title -->

        <label for="task-title">
          Task-এর নাম
        </label>

        <input
          type="text"
          id="task-title"
          placeholder="যেমন: একটি Website Visit করুন"
          maxlength="100"
          required
        >


        <!-- Description -->

        <label for="task-description">
          Task সম্পর্কে বিস্তারিত
        </label>

        <textarea
          id="task-description"
          placeholder="Worker কী করবে তা সংক্ষেপে লিখুন"
          maxlength="500"
        ></textarea>


        <!-- Task Type -->

        <label for="task-type">
          Task Type
        </label>

        <select
          id="task-type"
          required
        >

          <option value="link_visit">
            Link Visit
          </option>

          <option value="link_share">
            Link Share
          </option>

        </select>


        <!-- Reward -->

        <label for="task-reward">
          Reward (MHR GOLD)
        </label>

        <input
          type="number"
          id="task-reward"
          placeholder="যেমন: 100"
          min="1"
          step="1"
          required
        >


        <!-- Links -->

        <label>
          Task Link
        </label>

        <div id="task-links-container">

          <!-- tasks.js এখানে প্রথম Link তৈরি করবে -->

        </div>


        <!-- Add More -->

        <button
          type="button"
          id="add-link-btn"
        >
          + Add More
        </button>


        <!-- Submit -->

        <button
          type="submit"
          id="create-task-btn"
        >
          Task তৈরি করুন
        </button>

      </form>

    </section>


    <!-- ====================================
         TASK LIST
    ===================================== -->

    <section>

      <h2 class="task-list-title">
        📋 Available Tasks
      </h2>

      <div id="task-list">

        <p>
          Task লোড হচ্ছে...
        </p>

      </div>

    </section>


  </main>


  <!-- ======================================
       FOOTER
  ======================================= -->

  <footer>

    <div class="container">

      <p>
        © 2026 SocialWorkBD
      </p>

      <p>
        বাংলাদেশি Freelance & Task Marketplace
      </p>

    </div>

  </footer>


  <!-- ======================================
       FIREBASE CONFIG
  ======================================= -->

  <script src="firebase-config.js"></script>


  <!-- ======================================
       TASK JAVASCRIPT
  ======================================= -->

  <script src="tasks.js"></script>

</body>
</html>
