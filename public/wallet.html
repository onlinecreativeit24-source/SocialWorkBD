<select id="payment-method" required>
  <option value="paypal">PayPal</option>
</select>

<div id="payment-instructions" class="wallet-info"></div>

<div class="wallet-form-group">
  <label for="payment-reference">
    PayPal Transaction / Reference ID
  </label>

  <input
    id="payment-reference"
    type="text"
    placeholder="Enter your PayPal transaction/reference ID"
    autocomplete="off"
    required
  >
</div>
