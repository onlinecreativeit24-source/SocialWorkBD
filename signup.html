<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>সাইনআপ - SocialWorkBD</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore-compat.js"></script>
</head>

<body>

<header class="site-header">
  <div class="container">
    <h1>SocialWorkBD</h1>
    <p>কাজ করুন, দক্ষতা দিয়ে আয় করুন</p>

    <nav>
      <a href="index.html">হোম</a>
      <a href="login.html">লগইন</a>
    </nav>
  </div>
</header>

<main class="container">

  <section class="jobs-section">

    <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>
    <p>Client অথবা Worker হিসেবে অ্যাকাউন্ট তৈরি করুন।</p>

    <form id="signup-form">

      <label for="name">আপনার নাম</label>

      <input
        type="text"
        id="name"
        placeholder="আপনার পুরো নাম"
        autocomplete="name"
        required
      >

      <label for="email">ইমেইল</label>

      <input
        type="email"
        id="email"
        placeholder="example@email.com"
        autocomplete="email"
        required
      >

      <label for="password">পাসওয়ার্ড</label>

      <input
        type="password"
        id="password"
        placeholder="কমপক্ষে ৬ অক্ষর"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="confirm-password">
        পাসওয়ার্ড আবার লিখুন
      </label>

      <input
        type="password"
        id="confirm-password"
        placeholder="পাসওয়ার্ড নিশ্চিত করুন"
        minlength="6"
        autocomplete="new-password"
        required
      >

      <label for="role">
        আপনি কী করতে চান?
      </label>

      <select id="role" required>

        <option value="">
          — নির্বাচন করুন —
        </option>

        <option value="client">
          Client — আমি কাজ পোস্ট করব
        </option>

        <option value="worker">
          Worker — আমি কাজ করব
        </option>

      </select>

      <div id="skills-box" style="display:none;">

        <label for="skills">
          আপনার স্কিল
        </label>

        <input
          type="text"
          id="skills"
          placeholder="যেমন: Data Entry, Web Design"
        >

        <small>
          একাধিক স্কিল কমা (,) দিয়ে লিখতে পারেন।
        </small>

      </div>

      <button type="submit">
        সাইনআপ করুন
      </button>

    </form>

    <p style="margin-top:15px;">
      আগে থেকেই অ্যাকাউন্ট আছে?
      <a href="login.html">লগইন করুন</a>
    </p>

  </section>

</main>

<footer>
  <div class="container">
    <p>© 2026 SocialWorkBD</p>
    <p>বাংলাদেশি Freelance & Job Marketplace</p>
  </div>
</footer>

<script src="firebase-config.js"></script>
<script src="app.js"></script>

</body>
</html>
