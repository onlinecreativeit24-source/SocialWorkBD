<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - SocialWorkBD</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172033;font-family:Arial,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .card{width:100%;max-width:560px;background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:30px;box-shadow:0 15px 45px rgba(15,23,42,.08)}
    h1{text-align:center;margin:0 0 8px;font-size:29px}.sub{text-align:center;color:#667085;line-height:1.5;margin:0 0 25px}
    label{display:block;font-weight:700;font-size:14px;margin:0 0 7px}.field{margin-bottom:17px}
    input,textarea{width:100%;padding:13px 14px;border:1px solid #d5d9e2;border-radius:10px;font:inherit;outline:none}
    input:focus,textarea:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    textarea{min-height:90px;resize:vertical}.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .role{border:1px solid #d5d9e2;border-radius:12px;padding:14px;cursor:pointer}.role input{width:auto;margin-right:7px}
    .role strong{display:block;margin-top:5px}.role small{color:#667085;line-height:1.4}
    button{width:100%;border:0;border-radius:10px;padding:14px;background:#2563eb;color:#fff;font-weight:700;font-size:15px;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}.msg{display:none;padding:12px;border-radius:9px;margin-bottom:17px;font-size:14px;line-height:1.5}
    .error{display:block;background:#fff0f0;color:#a61b1b;border:1px solid #f0caca}.success{display:block;background:#effbea;color:#176b1d;border:1px solid #cfe9cf}
    .bottom{text-align:center;margin-top:18px;font-size:14px;color:#667085}.bottom a{color:#2563eb;font-weight:700;text-decoration:none}
    @media(max-width:600px){.wrap{padding:14px}.card{padding:23px 18px}.roles{grid-template-columns:1fr}}
  </style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <h1>Create your account</h1>
    <p class="sub">Join SocialWorkBD as a Freelancer or Client.</p>
    <div id="message" class="msg"></div>

    <form id="signup-form">
      <div class="field">
        <label for="name">Full name</label>
        <input id="name" type="text" autocomplete="name" required>
      </div>

      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label>Account type</label>
        <div class="roles">
          <label class="role">
            <input type="radio" name="role" value="worker" checked>
            <strong>Freelancer</strong>
            <small>Find projects and submit proposals.</small>
          </label>
          <label class="role">
            <input type="radio" name="role" value="client">
            <strong>Client</strong>
            <small>Post projects and hire freelancers.</small>
          </label>
        </div>
      </div>

      <div class="field">
        <label for="skills">Skills</label>
        <textarea id="skills" placeholder="Example: Web Development, Design, Data Entry"></textarea>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" minlength="6" autocomplete="new-password" required>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input id="confirm-password" type="password" minlength="6" autocomplete="new-password" required>
      </div>

      <button id="signup-btn" type="submit">Create Account</button>
    </form>

    <div style="text-align:center;color:#999;font-size:12px;margin:18px 0 12px">OR</div>
    <button id="google-signup" type="button" style="background:#14213d">Sign up with Google</button>

    <div class="bottom">Already have an account? <a href="login.html">Log in</a></div>
  </section>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>

<script>
(function () {
  const form = document.getElementById("signup-form");
  const btn = document.getElementById("signup-btn");
  const msg = document.getElementById("message");

  function showMessage(text, type) {
    msg.textContent = text;
    msg.className = "msg " + type;
  }

  function errorText(error) {
    const code = error && error.code ? error.code : "";
    const map = {
      "auth/email-already-in-use": "This email is already registered. Please log in instead.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Password must be at least 6 characters.",
      "auth/operation-not-allowed": "Email/password sign-up is disabled in Firebase. Enable Email/Password in Firebase Authentication > Sign-in method.",
      "auth/network-request-failed": "Network error. Check your internet connection and try again.",
      "permission-denied": "Firestore denied profile creation. Deploy the updated firestore.rules.",
      "auth/unauthorized-domain": "This domain is not authorized in Firebase Console > Authentication > Settings > Authorized domains.",
      "auth/popup-closed-by-user": "Google sign-in was closed before finishing."
    };
    return map[code] || (error && error.message) || "Account creation failed. Please try again.";
  }

  function accountId(role) {
    const prefix = role === "client" ? "SWB-C-" : "SWB-F-";
    return prefix + Date.now().toString().slice(-7) + Math.floor(100 + Math.random() * 900);
  }

  const REDIRECT_CODES = ["auth/popup-blocked","auth/operation-not-supported-in-this-environment","auth/web-storage-unsupported","auth/cancelled-popup-request"];
  const googleBtn = document.getElementById("google-signup");

  function goHome(role) {
    window.location.href = role === "client" ? "client-dashboard.html"
      : (role === "admin" || role === "superadmin") ? "admin.html" : "worker-dashboard.html";
  }

  async function finishGoogle(user, role) {
    const ref = firebase.firestore().collection("users").doc(user.uid);
    const snap = await ref.get();
    let data;
    if (snap.exists) {
      data = snap.data();
    } else {
      data = {
        uid: user.uid, accountId: accountId(role),
        name: user.displayName || (user.email || "").split("@")[0] || "SocialWorkBD User",
        email: user.email || "", role: role,
        skills: document.getElementById("skills").value.trim(),
        title: "", bio: "", location: "", photoURL: user.photoURL || "",
        balance: 0, pendingBalance: 0, status: "active", warnings: 0, violations: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };
      await ref.set(data);
    }
    if (data.status === "suspended") {
      await firebase.auth().signOut();
      throw new Error("Your account is currently suspended.");
    }
    localStorage.setItem("currentUser", JSON.stringify({
      uid: user.uid, id: user.uid, name: data.name || "", email: data.email || "",
      role: data.role || "worker", accountId: data.accountId || "",
      balance: Number(data.balance || 0), pendingBalance: Number(data.pendingBalance || 0), status: data.status || "active"
    }));
    goHome(data.role);
  }

  googleBtn.addEventListener("click", async function () {
    const role = document.querySelector('input[name="role"]:checked')?.value || "worker";
    sessionStorage.setItem("swbdSignupRole", role);
    googleBtn.disabled = true;
    googleBtn.textContent = "Connecting...";
    msg.className = "msg";
    const provider = new firebase.auth.GoogleAuthProvider();
    provider.setCustomParameters({prompt: "select_account"});
    try {
      try {
        const result = await firebase.auth().signInWithPopup(provider);
        await finishGoogle(result.user, role);
      } catch (popupError) {
        if (REDIRECT_CODES.indexOf(popupError.code) !== -1) {
          await firebase.auth().signInWithRedirect(provider);
          return;
        }
        throw popupError;
      }
    } catch (error) {
      console.error("Google signup error:", error);
      if (error.code !== "auth/popup-closed-by-user") showMessage(errorText(error), "error");
    } finally {
      googleBtn.disabled = false;
      googleBtn.textContent = "Sign up with Google";
    }
  });

  if (typeof firebase !== "undefined" && firebase.apps.length) {
    firebase.auth().getRedirectResult().then(function (result) {
      if (result && result.user) {
        const role = sessionStorage.getItem("swbdSignupRole") || "worker";
        return finishGoogle(result.user, role);
      }
    }).catch(function (error) {
      if (error && error.code !== "auth/no-auth-event") showMessage(errorText(error), "error");
    });
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    msg.className = "msg";
    msg.textContent = "";

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const skills = document.getElementById("skills").value.trim();
    const password = document.getElementById("password").value;
    const confirm = document.getElementById("confirm-password").value;
    const role = document.querySelector('input[name="role"]:checked')?.value || "worker";

    if (!name) return showMessage("Please enter your full name.", "error");
    if (!email) return showMessage("Please enter your email.", "error");
    if (password.length < 6) return showMessage("Password must be at least 6 characters.", "error");
    if (password !== confirm) return showMessage("Passwords do not match.", "error");

    if (typeof firebase === "undefined" || !firebase.apps.length) {
      return showMessage("Firebase could not be initialized. Check firebase-config.js.", "error");
    }

    btn.disabled = true;
    btn.textContent = "Creating account...";

    let createdUser = null;

    try {
      const result = await firebase.auth().createUserWithEmailAndPassword(email, password);
      createdUser = result.user;

      try {
        await createdUser.updateProfile({displayName: name});
      } catch (_) {}

      const profile = {
        uid: createdUser.uid,
        accountId: accountId(role),
        name: name,
        email: email,
        role: role,
        skills: skills,
        title: "",
        bio: "",
        location: "",
        photoURL: createdUser.photoURL || "",
        balance: 0,
        pendingBalance: 0,
        status: "active",
        warnings: 0,
        violations: 0,
        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      };

      await firebase.firestore().collection("users").doc(createdUser.uid).set(profile);

      localStorage.setItem("currentUser", JSON.stringify({
        uid: createdUser.uid,
        id: createdUser.uid,
        name: name,
        email: email,
        role: role,
        accountId: profile.accountId,
        balance: 0,
        pendingBalance: 0,
        status: "active"
      }));

      await firebase.auth().signOut();
      showMessage("Account created successfully. Redirecting to login...", "success");

      setTimeout(function () {
        window.location.href = "login.html";
      }, 700);

    } catch (error) {
      console.error("SocialWorkBD signup error:", error);

      // If Auth succeeded but Firestore profile creation failed,
      // remove the newly-created Auth user so signup does not leave a broken account.
      if (createdUser) {
        try { await createdUser.delete(); } catch (_) {}
        localStorage.removeItem("currentUser");
      }

      showMessage(errorText(error), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Create Account";
    }
  });
})();
</script>
</body>
</html>
