<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>সাইনআপ - SocialWorkBD</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

  <header class="site-header">
    <div class="container">

      <h1>SocialWorkBD</h1>

      <p>কাজ করুন, দক্ষতা দিয়ে আয় করুন</p>

      <nav>
        <a href="index.html">হোম</a>
        <a href="login.html">লগইন</a>
      </nav>

    </div>
  </header>

  <main class="container">

    <section class="jobs-section">

      <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>

      <p>
        SocialWorkBD-তে কাজ করতে বা কাজ দিতে নতুন অ্যাকাউন্ট তৈরি করুন।
      </p>

      <form id="signup-form">

        <label for="name">নাম</label>

        <input
          type="text"
          id="name"
          placeholder="আপনার নাম"
          autocomplete="name"
          required
        >

        <label for="email">ইমেইল</label>

        <input
          type="email"
          id="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >

        <label for="password">পাসওয়ার্ড</label>

        <input
          type="password"
          id="password"
          placeholder="কমপক্ষে ৬ অক্ষর"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label for="confirm-password">
          পাসওয়ার্ড আবার লিখুন
        </label>

        <input
          type="password"
          id="confirm-password"
          placeholder="পাসওয়ার্ড আবার লিখুন"
          autocomplete="new-password"
          minlength="6"
          required
        >

        <label for="role">
          আপনি কী করতে চান?
        </label>

        <select id="role" required>

          <option value="worker">
            Worker - কাজ করে আয় করতে চাই
          </option>

          <option value="client">
            Client - কাজ দিতে চাই
          </option>

        </select>

        <label for="skills">
          আপনার Skills
        </label>

        <input
          type="text"
          id="skills"
          placeholder="যেমন: Data Entry, Graphic Design, Writing"
        >

        <button type="submit">
          সাইনআপ করুন
        </button>

      </form>

      <p style="margin-top:20px;text-align:center;">

        ইতিমধ্যে অ্যাকাউন্ট আছে?

        <a href="login.html">
          লগইন করুন
        </a>

      </p>

    </section>

  </main>

  <footer>

    <div class="container">

      <p>© 2026 SocialWorkBD</p>

      <p>বাংলাদেশি Freelance & Job Marketplace</p>

    </div>

  </footer>

  <!-- Firebase Configuration -->
  <script src="firebase-config.js"></script>

  <!-- Main App -->
  <script src="app.js"></script>

</body>
</html>
