<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - SocialWorkBD</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#181818;font-family:Arial,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{width:100%;max-width:460px;background:#fff;border:1px solid #ddd;border-radius:16px;padding:30px;box-shadow:0 15px 45px rgba(0,0,0,.07)}
    .brand{text-align:center;font-size:23px;font-weight:800;margin-bottom:25px}.brand span{color:#14a800}
    h1{margin:0 0 8px;font-size:27px}.sub{color:#666;font-size:14px;line-height:1.5;margin:0 0 24px}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.field{margin-bottom:16px}
    input,select{width:100%;height:48px;border:1px solid #ccc;border-radius:8px;padding:0 13px;font:inherit;outline:none;background:#fff}
    input:focus,select:focus{border-color:#14a800;box-shadow:0 0 0 3px #e9f7e6}
    button{width:100%;min-height:48px;border:0;border-radius:8px;background:#14a800;color:#fff;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}
    a{color:#14a800;font-weight:700;text-decoration:none}.msg{display:none;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px;line-height:1.5}
    .error{display:block;background:#fff0f0;color:#a61b1b;border:1px solid #f0caca}.success{display:block;background:#effbea;color:#176b1d;border:1px solid #cfe9cf}
    .divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:#999;font-size:11px}.divider:before,.divider:after{content:"";height:1px;background:#ddd;flex:1}
    .google{background:#ffffff;color:#3c4043;border:1px solid #dadce0;margin-bottom:18px;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;transition:background-color .2s}
    .google:hover{background:#f8f9fa;border-color:#d2e3fc}
    .google svg{width:18px;height:18px;flex-shrink:0}
    .bottom{text-align:center;color:#666;font-size:13px}
  </style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="brand">SocialWork<span>BD</span></div>
    <h1>Create an account</h1>
    <p class="sub">Join SocialWorkBD to start working, hiring, and growing.</p>
    <div id="message" class="msg"></div>

    <form id="signup-form">
      <div class="field">
        <label for="name">Full Name</label>
        <input id="name" type="text" autocomplete="name" placeholder="Enter your name" required>
      </div>
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" placeholder="Enter your email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="new-password" placeholder="Minimum 6 characters" required>
      </div>
      <div class="field">
        <label for="role">Account Type</label>
        <select id="role" required>
          <option value="worker">Worker / Freelancer</option>
          <option value="client">Client / Employer</option>
        </select>
      </div>
      <button id="signup-btn" type="submit">Create Account</button>
    </form>

    <div class="divider">OR</div>
    <button class="google" id="google-btn" type="button">
      <svg viewBox="0 0 24 24">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.15C3.25 21.3 7.31 24 12 24z"/>
        <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.27C.46 8.2 0 10.04 0 12s.46 3.8 1.27 5.42l4.01-3.15z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.58l4.01 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
      </svg>
      Continue with Google
    </button>
    <div class="bottom">Already have an account? <a href="login.html">Log In</a></div>
  </section>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>

<script>
(function () {
  const form = document.getElementById("signup-form");
  const btn = document.getElementById("signup-btn");
  const googleBtn = document.getElementById("google-btn");
  const msg = document.getElementById("message");

  function show(text, type) {
    msg.textContent = text;
    msg.className = "msg " + type;
  }

  function getAuth() {
    return window.auth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);
  }

  function getDb() {
    return window.db || (typeof firebase !== 'undefined' && firebase.firestore ? firebase.firestore() : null);
  }

  function errorText(error) {
    const code = error && error.code ? error.code : "";
    const map = {
      "auth/email-already-in-use": "An account with this email already exists.",
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/weak-password": "Password should be at least 6 characters.",
      "auth/operation-not-allowed": "This sign-up method is currently disabled.",
      "auth/network-request-failed": "Network error. Check your internet connection."
    };
    return map[code] || (error && error.message) || "Account creation failed. Please try again.";
  }

  function accountId(role) {
    const prefix = role === "client" ? "SWB-C-" : "SWB-F-";
    return prefix + Date.now().toString().slice(-7) + Math.floor(100 + Math.random() * 900);
  }

  async function createProfile(user, name, role) {
    const db = getDb();
    if (!db) throw new Error("Database initialization failed.");

    const ref = db.collection("users").doc(user.uid);
    const snap = await ref.get();

    if (snap.exists) {
      return {id: snap.id, ...snap.data()};
    }

    const selectedRole = role || "worker";
    const profile = {
      uid: user.uid,
      accountId: accountId(selectedRole),
      name: name || user.displayName || (user.email || "").split("@")[0] || "SocialWorkBD User",
      email: user.email || "",
      role: selectedRole,
      skills: "",
      title: "",
      bio: "",
      location: "",
      photoURL: user.photoURL || "",
      balance: 0,
      pendingBalance: 0,
      status: "active",
      warnings: 0,
      violations: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await ref.set(profile);
    return {id: user.uid, ...profile};
  }

  function saveProfile(profile) {
    localStorage.setItem("currentUser", JSON.stringify({
      id: profile.uid,
      uid: profile.uid,
      name: profile.name || "",
      email: profile.email || "",
      role: profile.role || "worker",
      skills: profile.skills || "",
      bio: profile.bio || "",
      title: profile.title || "",
      location: profile.location || "",
      photoURL: profile.photoURL || "",
      accountId: profile.accountId || "",
      balance: Number(profile.balance || 0),
      pendingBalance: Number(profile.pendingBalance || 0),
      status: profile.status || "active"
    }));
  }

  function redirect(profile) {
    if (profile.role === "client") {
      window.location.href = "client-dashboard.html";
    } else if (profile.role === "worker" || profile.role === "freelancer") {
      window.location.href = "worker-dashboard.html";
    } else if (profile.role === "admin" || profile.role === "superadmin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "profile.html";
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    msg.className = "msg";

    const auth = getAuth();
    if (!auth) return show("Firebase Auth loading error.", "error");

    const name = document.getElementById("name").value.trim();
    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;
    const role = document.getElementById("role").value;

    if (!name || !email || !password) return show("Please fill in all fields.", "error");

    btn.disabled = true;
    btn.textContent = "Creating account...";

    try {
      const result = await auth.createUserWithEmailAndPassword(email, password);
      await result.user.updateProfile({ displayName: name });
      const profile = await createProfile(result.user, name, role);

      saveProfile(profile);
      show("Account created successfully. Redirecting...", "success");
      setTimeout(() => redirect(profile), 400);
    } catch (error) {
      console.error("SocialWorkBD signup error:", error);
      show(errorText(error), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Create Account";
    }
  });

  googleBtn.addEventListener("click", async function () {
    const auth = getAuth();
    if (!auth) return show("Firebase Auth loading error.", "error");

    googleBtn.disabled = true;
    googleBtn.textContent = "Connecting...";
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt: "select_account"});
      const result = await auth.signInWithPopup(provider);
      const profile = await createProfile(result.user, result.user.displayName, "worker");
      saveProfile(profile);
      redirect(profile);
    } catch (error) {
      console.error("Google signup error:", error);
      show(errorText(error), "error");
    } finally {
      googleBtn.disabled = false;
      googleBtn.innerHTML = `
        <svg viewBox="0 0 24 24">
          <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.27v3.15C3.25 21.3 7.31 24 12 24z"/>
          <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.27C.46 8.2 0 10.04 0 12s.46 3.8 1.27 5.42l4.01-3.15z"/>
          <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.31 0 3.25 2.7 1.27 6.58l4.01 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
        </svg>
        Continue with Google
      `;
    }
  });
})();
</script>
</body>
</html>
