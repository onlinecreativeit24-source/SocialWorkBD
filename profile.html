<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>আমার প্রোফাইল - SocialWorkBD</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

  <header>
    <h1>SocialWorkBD</h1>
    <p>আমার প্রোফাইল</p>

    <nav>
      <a href="index.html">হোম</a>
      <a href="dashboard.html">ড্যাশবোর্ড</a>
    </nav>
  </header>

  <main>

    <section class="auth-box">

      <h2>👤 আমার প্রোফাইল</h2>

      <div id="profile-loading">
        প্রোফাইল লোড হচ্ছে...
      </div>

      <div id="profile-content" style="display:none;">

        <div class="profile-info">
          <p>
            <strong>নাম:</strong>
            <span id="user-name">-</span>
          </p>

          <p>
            <strong>ইমেইল:</strong>
            <span id="user-email">-</span>
          </p>

          <p>
            <strong>অ্যাকাউন্ট:</strong>
            <span id="user-role">Worker</span>
          </p>

          <p>
            <strong>দক্ষতা:</strong>
            <span id="user-skills">-</span>
          </p>

          <p>
            <strong>পরিচিতি:</strong>
            <span id="user-bio">-</span>
          </p>

        </div>

        <hr style="margin:25px 0;">

        <h3>✏️ প্রোফাইল Edit করুন</h3>

        <form id="profile-form">

          <label for="profile-name">
            নাম
          </label>

          <input
            type="text"
            id="profile-name"
            required
          >

          <label for="profile-role">
            আপনি কে?
          </label>

          <select id="profile-role">
            <option value="worker">Worker</option>
            <option value="client">Client</option>
          </select>

          <label for="profile-skills">
            আপনার Skills
          </label>

          <input
            type="text"
            id="profile-skills"
            placeholder="যেমন: Graphic Design, Writing"
          >

          <label for="profile-bio">
            নিজের সম্পর্কে
          </label>

          <textarea
            id="profile-bio"
            rows="4"
            placeholder="সংক্ষিপ্ত পরিচিতি লিখুন"
          ></textarea>

          <button
            type="submit"
            id="save-profile"
          >
            💾 Save Profile
          </button>

        </form>

        <button
          type="button"
          id="logout-btn"
          style="margin-top:20px;"
        >
          🚪 Logout
        </button>

      </div>

    </section>

  </main>

  <footer>
    <p>© 2026 SocialWorkBD</p>
    <p>বাংলাদেশি Freelance & Job Marketplace</p>
  </footer>

  <!-- Firebase Configuration -->
  <script src="firebase-config.js"></script>

  <!-- Main App -->
  <script src="app.js"></script>

</body>
</html>
