<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - SocialWorkBD</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f7f7f5;color:#181818;font-family:Arial,sans-serif}
    .wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}
    .card{width:100%;max-width:460px;background:#fff;border:1px solid #ddd;border-radius:16px;padding:30px;box-shadow:0 15px 45px rgba(0,0,0,.07)}
    .brand{text-align:center;font-size:23px;font-weight:800;margin-bottom:25px}.brand span{color:#14a800}
    h1{margin:0 0 8px;font-size:27px}.sub{color:#666;font-size:14px;line-height:1.5;margin:0 0 24px}
    label{display:block;font-size:13px;font-weight:700;margin:0 0 7px}.field{margin-bottom:16px}
    input{width:100%;height:48px;border:1px solid #ccc;border-radius:8px;padding:0 13px;font:inherit;outline:none}
    input:focus{border-color:#14a800;box-shadow:0 0 0 3px #e9f7e6}
    button{width:100%;min-height:48px;border:0;border-radius:8px;background:#14a800;color:#fff;font-weight:800;cursor:pointer}
    button:disabled{opacity:.6;cursor:not-allowed}.link{text-align:center;margin:14px 0;font-size:13px}
    a{color:#14a800;font-weight:700;text-decoration:none}.msg{display:none;padding:12px;border-radius:8px;margin-bottom:16px;font-size:13px;line-height:1.5}
    .error{display:block;background:#fff0f0;color:#a61b1b;border:1px solid #f0caca}.success{display:block;background:#effbea;color:#176b1d;border:1px solid #cfe9cf}
    .divider{display:flex;align-items:center;gap:10px;margin:22px 0;color:#999;font-size:11px}.divider:before,.divider:after{content:"";height:1px;background:#ddd;flex:1}
    .google{background:#14213d;margin-bottom:18px}.bottom{text-align:center;color:#666;font-size:13px}
  </style>
</head>
<body>
<div class="wrap">
  <section class="card">
    <div class="brand">SocialWork<span>BD</span></div>
    <h1>Welcome back</h1>
    <p class="sub">Log in to continue working, hiring and growing on SocialWorkBD.</p>
    <div id="message" class="msg"></div>

    <form id="login-form">
      <div class="field">
        <label for="email">Email address</label>
        <input id="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button id="login-btn" type="submit">Log In</button>
    </form>

    <div class="link"><a href="#" id="forgot">Forgot password?</a></div>
    <div class="divider">OR</div>
    <button class="google" id="google-btn" type="button">Continue with Google</button>
    <div class="bottom">Don't have an account? <a href="signup.html">Create an account</a></div>
  </section>
</div>

<!-- Firebase SDK (v8 Compat mode for stable operation) -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
<script src="firebase-config.js"></script>

<script>
(function () {
  const form = document.getElementById("login-form");
  const btn = document.getElementById("login-btn");
  const googleBtn = document.getElementById("google-btn");
  const msg = document.getElementById("message");

  function show(text, type) {
    msg.textContent = text;
    msg.className = "msg " + type;
  }

  function getAuth() {
    return window.auth || (typeof firebase !== 'undefined' && firebase.auth ? firebase.auth() : null);
  }

  function getDb() {
    return window.db || (typeof firebase !== 'undefined' && firebase.firestore ? firebase.firestore() : null);
  }

  function errorText(error) {
    const code = error && error.code ? error.code : "";
    const map = {
      "auth/invalid-email": "Please enter a valid email address.",
      "auth/user-not-found": "No account found with this email address.",
      "auth/wrong-password": "Incorrect password.",
      "auth/invalid-credential": "Invalid email or password.",
      "auth/user-disabled": "This account has been disabled.",
      "auth/operation-not-allowed": "This sign-in method is disabled in Firebase.",
      "auth/network-request-failed": "Network error. Check your internet connection.",
      "auth/too-many-requests": "Too many attempts. Please try again later."
    };
    return map[code] || (error && error.message) || "Login failed. Please try again.";
  }

  function accountId(role) {
    const prefix = role === "client" ? "SWB-C-" : "SWB-F-";
    return prefix + Date.now().toString().slice(-7) + Math.floor(100 + Math.random() * 900);
  }

  async function loadOrCreateProfile(user) {
    const db = getDb();
    if (!db) throw new Error("Database initialization failed.");

    const ref = db.collection("users").doc(user.uid);
    const snap = await ref.get();

    if (snap.exists) {
      return {id: snap.id, ...snap.data()};
    }

    const profile = {
      uid: user.uid,
      accountId: accountId("worker"),
      name: user.displayName || (user.email || "").split("@")[0] || "SocialWorkBD User",
      email: user.email || "",
      role: "worker",
      skills: "",
      title: "",
      bio: "",
      location: "",
      photoURL: user.photoURL || "",
      balance: 0,
      pendingBalance: 0,
      status: "active",
      warnings: 0,
      violations: 0,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };

    await ref.set(profile);
    return {id: user.uid, ...profile};
  }

  function saveProfile(profile) {
    localStorage.setItem("currentUser", JSON.stringify({
      id: profile.uid,
      uid: profile.uid,
      name: profile.name || "",
      email: profile.email || "",
      role: profile.role || "worker",
      skills: profile.skills || "",
      bio: profile.bio || "",
      title: profile.title || "",
      location: profile.location || "",
      photoURL: profile.photoURL || "",
      accountId: profile.accountId || "",
      balance: Number(profile.balance || 0),
      pendingBalance: Number(profile.pendingBalance || 0),
      status: profile.status || "active"
    }));
  }

  function redirect(profile) {
    if (profile.role === "client") {
      window.location.href = "client-dashboard.html";
    } else if (profile.role === "worker" || profile.role === "freelancer") {
      window.location.href = "worker-dashboard.html";
    } else if (profile.role === "admin" || profile.role === "superadmin") {
      window.location.href = "admin.html";
    } else {
      window.location.href = "profile.html";
    }
  }

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    msg.className = "msg";

    const auth = getAuth();
    if (!auth) return show("Firebase Auth loading error.", "error");

    const email = document.getElementById("email").value.trim().toLowerCase();
    const password = document.getElementById("password").value;

    if (!email || !password) return show("Enter your email and password.", "error");

    btn.disabled = true;
    btn.textContent = "Signing in...";

    try {
      const result = await auth.signInWithEmailAndPassword(email, password);
      const profile = await loadOrCreateProfile(result.user);

      if (profile.status === "suspended") {
        await auth.signOut();
        localStorage.removeItem("currentUser");
        throw new Error("Your account is currently suspended.");
      }

      saveProfile(profile);
      show("Login successful. Redirecting...", "success");
      setTimeout(() => redirect(profile), 400);
    } catch (error) {
      console.error("SocialWorkBD login error:", error);
      show(errorText(error), "error");
    } finally {
      btn.disabled = false;
      btn.textContent = "Log In";
    }
  });

  googleBtn.addEventListener("click", async function () {
    const auth = getAuth();
    if (!auth) return show("Firebase Auth loading error.", "error");

    googleBtn.disabled = true;
    googleBtn.textContent = "Connecting...";
    try {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({prompt: "select_account"});
      const result = await auth.signInWithPopup(provider);
      const profile = await loadOrCreateProfile(result.user);
      saveProfile(profile);
      redirect(profile);
    } catch (error) {
      console.error("Google login error:", error);
      show(errorText(error), "error");
    } finally {
      googleBtn.disabled = false;
      googleBtn.textContent = "Continue with Google";
    }
  });

  document.getElementById("forgot").addEventListener("click", async function (e) {
    e.preventDefault();
    const auth = getAuth();
    if (!auth) return show("Firebase Auth loading error.", "error");

    const email = document.getElementById("email").value.trim().toLowerCase();
    if (!email) return show("Enter your email first, then tap Forgot password again.", "error");

    try {
      await auth.sendPasswordResetEmail(email);
      show("Password reset email sent. Check your inbox.", "success");
    } catch (error) {
      show(errorText(error), "error");
    }
  });
})();
</script>
</body>
</html>
