<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login - SocialWorkBD</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

  <header>
    <h1>SocialWorkBD</h1>
    <p>Login করুন</p>
  </header>

  <main>

    <section class="auth-box">

      <h2>Login</h2>

      <!-- Email Login -->
      <form id="login-form">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="আপনার Email লিখুন"
          autocomplete="email"
          required
        >

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="আপনার Password লিখুন"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
        >
          Login
        </button>

      </form>

      <!-- Forgot Password -->
      <div style="margin-top:12px;">
        <a
          href="#"
          id="forgot-password"
        >
          Forgot Password?
        </a>
      </div>

      <div class="auth-divider">
        <span>অথবা</span>
      </div>

      <!-- Google Login -->
      <button
        type="button"
        id="google-login"
        class="social-login google-login"
      >
        🔵 Continue with Google
      </button>

      <!-- Signup -->
      <p style="margin-top:20px;">
        নতুন User?
        <a href="signup.html">
          Signup করুন
        </a>
      </p>

    </section>

  </main>

  <!-- Firebase Configuration -->
  <script src="firebase-config.js"></script>

  <!-- Main App -->
  <script src="app.js"></script>

  <!-- Google Login -->
  <script>

    document.addEventListener("DOMContentLoaded", () => {

      const googleButton =
        document.getElementById("google-login");

      if (!googleButton) return;

      googleButton.addEventListener(
        "click",
        async () => {

          const auth = window.auth;
          const db = window.db;

          if (!auth || !db) {

            alert(
              "Firebase load হয়নি।\n\n" +
              "firebase-config.js ঠিকভাবে যুক্ত আছে কি না দেখুন।"
            );

            return;
          }

          try {

            googleButton.disabled = true;
            googleButton.textContent =
              "Google Login হচ্ছে...";

            const provider =
              new firebase.auth.GoogleAuthProvider();

            provider.addScope("profile");
            provider.addScope("email");

            const result =
              await auth.signInWithPopup(provider);

            const user =
              result.user;

            // --------------------------------
            // Check Firestore Profile
            // --------------------------------

            const userRef =
              db.collection("users")
                .doc(user.uid);

            const userDoc =
              await userRef.get();

            let profile;

            if (userDoc.exists) {

              profile =
                userDoc.data();

            } else {

              // Google user নতুন হলে profile তৈরি
              profile = {

                uid:
                  user.uid,

                name:
                  user.displayName ||
                  user.email?.split("@")[0] ||
                  "User",

                email:
                  user.email || "",

                role:
                  "worker",

                skills:
                  "",

                balance:
                  0,

                pendingBalance:
                  0,

                createdAt:
                  firebase.firestore
                    .FieldValue
                    .serverTimestamp()

              };

              await userRef.set(profile);
            }

            // --------------------------------
            // Local Session
            // --------------------------------

            localStorage.setItem(
              "currentUser",
              JSON.stringify({

                id:
                  user.uid,

                name:
                  profile.name ||
                  user.displayName ||
                  "User",

                email:
                  user.email || "",

                role:
                  profile.role ||
                  "worker",

                skills:
                  profile.skills || "",

                balance:
                  Number(
                    profile.balance || 0
                  ),

                pendingBalance:
                  Number(
                    profile.pendingBalance || 0
                  )

              })
            );

            alert(
              "Google Login সফল হয়েছে!"
            );

            window.location.href =
              "index.html";

          } catch (error) {

            console.error(
              "GOOGLE LOGIN ERROR:",
              error
            );

            let message =
              "Google Login Error\n\n" +
              "Code: " +
              (error.code || "unknown") +
              "\n\n" +
              "Message: " +
              (error.message || "Unknown error");

            if (
              error.code ===
              "auth/popup-closed-by-user"
            ) {

              message =
                "Google Login window বন্ধ হয়ে গেছে। আবার চেষ্টা করুন।";

            } else if (
              error.code ===
              "auth/popup-blocked"
            ) {

              message =
                "Browser Google Login popup block করেছে। Popup allow করে আবার চেষ্টা করুন।";

            } else if (
              error.code ===
              "auth/account-exists-with-different-credential"
            ) {

              message =
                "এই Email দিয়ে আগে অন্য Login method ব্যবহার করে Account তৈরি হয়েছে।";

            } else if (
              error.code ===
              "auth/unauthorized-domain"
            ) {

              message =
                "এই website domain Firebase Authentication-এ অনুমোদিত নয়।";

            }

            alert(message);

          } finally {

            googleButton.disabled = false;

            googleButton.textContent =
              "🔵 Continue with Google";

          }

        }
      );

    });

  </script>

</body>
</html>
