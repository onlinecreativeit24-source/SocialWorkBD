<!DOCTYPE html>
<html lang="bn">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Login - SocialWorkBD</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

</head>


<body>


  <header class="site-header">

    <div class="container">

      <h1>SocialWorkBD</h1>

      <p>
        কাজ করুন, দক্ষতা দিয়ে আয় করুন
      </p>

      <nav>

        <a href="index.html">
          হোম
        </a>

        <a href="signup.html">
          সাইনআপ
        </a>

      </nav>

    </div>

  </header>


  <main class="container">

    <section class="auth-box">


      <h2>
        আপনার অ্যাকাউন্টে Login করুন
      </h2>


      <p>
        SocialWorkBD ব্যবহার করতে Login করুন।
      </p>


      <!-- ==============================
           EMAIL LOGIN
      =============================== -->

      <form id="login-form">


        <label for="email">
          ইমেইল
        </label>


        <input
          type="email"
          id="email"
          placeholder="আপনার Email লিখুন"
          autocomplete="email"
          required
        >


        <label for="password">
          পাসওয়ার্ড
        </label>


        <input
          type="password"
          id="password"
          placeholder="আপনার Password লিখুন"
          autocomplete="current-password"
          required
        >


        <button
          type="submit"
        >
          লগইন
        </button>


      </form>


      <!-- ==============================
           FORGOT PASSWORD
      =============================== -->

      <div
        style="
          margin-top:14px;
          text-align:center;
        "
      >

        <a
          href="#"
          id="forgot-password"
        >
          পাসওয়ার্ড ভুলে গেছেন?
        </a>

      </div>


      <!-- ==============================
           DIVIDER
      =============================== -->

      <div
        class="auth-divider"
        style="
          margin:20px 0;
          text-align:center;
        "
      >

        <span>
          অথবা
        </span>

      </div>


      <!-- ==============================
           GOOGLE LOGIN
      =============================== -->

      <button
        type="button"
        id="google-login"
        class="social-login google-login"
        style="width:100%;"
      >
        🔵 Continue with Google
      </button>


      <!-- ==============================
           SIGNUP LINK
      =============================== -->

      <p
        style="
          margin-top:22px;
          text-align:center;
        "
      >

        নতুন User?

        <a href="signup.html">
          Signup করুন
        </a>

      </p>


    </section>

  </main>


  <footer>

    <div class="container">

      <p>
        © 2026 SocialWorkBD
      </p>

      <p>
        বাংলাদেশি Freelance & Job Marketplace
      </p>

    </div>

  </footer>


  <!-- Firebase Configuration -->

  <script src="firebase-config.js"></script>


  <!-- Main App -->

  <script src="app.js"></script>


</body>

</html>
