
<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login - SocialWorkBD</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <header>
    <h1>SocialWorkBD</h1>
    <p>Client ও Worker Login</p>
  </header>

  <main>

    <section class="auth-card">

      <h2>Login</h2>

      <form id="login-form">

        <!-- Email -->
        <label for="email">ইমেইল</label>

        <input
          type="email"
          id="email"
          name="email"
          placeholder="আপনার ইমেইল লিখুন"
          autocomplete="email"
          required
        />

        <!-- Password -->
        <label for="password">পাসওয়ার্ড</label>

        <input
          type="password"
          id="password"
          name="password"
          placeholder="আপনার পাসওয়ার্ড লিখুন"
          autocomplete="current-password"
          required
        />

        <!-- Login -->
        <button type="submit">
          Login
        </button>

      </form>

      <!-- Forgot Password -->
      <div class="auth-links">

        <a href="#" id="forgot-password">
          পাসওয়ার্ড ভুলে গেছেন?
        </a>

        <a href="signup.html">
          নতুন অ্যাকাউন্ট তৈরি করুন
        </a>

      </div>

      <p id="login-message"></p>

    </section>

  </main>

  <footer>
    <p>© 2026 SocialWorkBD</p>
  </footer>

  <script src="app.js"></script>

</body>
</html>
