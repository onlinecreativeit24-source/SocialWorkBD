<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Job Post - SocialWorkBD</title>

  <link rel="stylesheet" href="styles.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
</head>

<body>

  <header>
    <h1>SocialWorkBD</h1>
    <p>নতুন কাজ পোস্ট করুন</p>

    <nav>
      <a href="index.html">হোম</a>
      <a href="dashboard.html">ড্যাশবোর্ড</a>
      <a href="profile.html">প্রোফাইল</a>
    </nav>
  </header>

  <main>

    <section class="auth-box">

      <h2>💼 নতুন Job Post করুন</h2>

      <form id="job-form">

        <label for="title">কাজের শিরোনাম</label>

        <input
          type="text"
          id="title"
          placeholder="যেমন: একটি Logo Design প্রয়োজন"
          required
        >

        <label for="desc">কাজের বিস্তারিত</label>

        <textarea
          id="desc"
          rows="6"
          placeholder="কাজ সম্পর্কে বিস্তারিত লিখুন"
          required
        ></textarea>

        <label for="budget">বাজেট (BDT)</label>

        <input
          type="number"
          id="budget"
          min="1"
          placeholder="যেমন: 1000"
          required
        >

        <label for="skills">প্রয়োজনীয় Skills</label>

        <input
          type="text"
          id="skills"
          placeholder="যেমন: Graphic Design, Photoshop"
          required
        >

        <label for="delivery-days">কাজের সময়সীমা (দিন)</label>

        <input
          type="number"
          id="delivery-days"
          min="1"
          placeholder="যেমন: 7"
          required
        >

        <button type="submit" id="post-job-btn">
          Job Post করুন
        </button>

      </form>

    </section>

  </main>

  <footer>
    <p>© 2026 SocialWorkBD</p>
  </footer>

  <script src="firebase-config.js"></script>
  <script src="app.js"></script>

</body>
</html>
